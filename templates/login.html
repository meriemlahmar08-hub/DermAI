<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DermAI — Connexion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-wrapper">
  <div class="container">
    <div class="login-logo">
      <div class="logo-icon">🔬</div>
      <h1>Derm<span>AI</span></h1>
      <p>Plateforme de diagnostic dermatologique IA</p>
    </div>
    <div class="card">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <div class="form-group">
          <label class="form-label">Nom d'utilisateur</label>
          <input class="form-control" type="text" name="username" placeholder="Identifiant" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <input class="form-control" type="password" name="password" placeholder="••••••••" required>
        </div>
        <hr class="divider">
        <button type="submit" class="btn btn-primary btn-lg">Se connecter →</button>
      </form>
    </div>
    <p class="footer-note">© 2026 DermAI — Système de diagnostic IA</p>
  </div>
</div>
</body>
</html>
